    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #180f2e;
      font-family: Arial, Helvetica, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -35px;
      background-image: linear-gradient(#160e2870, #160e2870), var(--poster);
      background-position: center;
      background-size: cover;
      filter: blur(18px);
      z-index: 0;
    }
    .poster {
      width: min(100vw, calc(100dvh * 2 / 3));
      aspect-ratio: 2 / 3;
      position: relative;
      background-image: var(--poster);
      background-position: center;
      background-size: 100% 100%;
      box-shadow: 0 8px 45px #0009;
      isolation: isolate;
      z-index: 1;
    }
    .hit {
      position: absolute;
      padding: 0;
      margin: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .hit:focus-visible { outline: 4px solid #ffdd40; outline-offset: 3px; }
    #yes {
      left: 16.0%; top: 69.6%; width: 29.0%; height: 6.5%;
      background: transparent;
      border: 0;
      color: transparent;
      border-radius: 9px;
      font-family: Impact, 'Arial Black', Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(12px, 4.2vw, 28px);
      z-index: 2;
      transform-origin: 50% 50%;
      transition: transform .28s cubic-bezier(.2, 1.5, .3, 1), background .2s;
    }
    #yes.growing {
      background: #ffdc2c;
      border: 2px solid #211b2b;
      box-shadow: 3px 5px 0 #de3b46;
      color: #151128;
      text-shadow: 1px 1px #fff2;
    }
    #no {
      left: 49.5%; top: 69.6%; width: 22.4%; height: 6.5%;
      background: transparent;
      border: 0;
      border-radius: 8px;
      z-index: 1;
    }
    .success {
      position: absolute;
      inset: 26.7% 24% 25.8% 13.2%;
      background: #e6dfc9;
      border: 5px solid #181525;
      border-radius: 13% / 10%;
      box-shadow: inset 0 0 60px #59788e66, 0 0 18px #51bbd555;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.1%;
      text-align: center;
      padding: 5%;
      z-index: 3;
    }
    .success.show { display: flex; animation: appear .2s ease-out; }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    .success .tag {
      font: 700 clamp(9px, 2.5vw, 18px) monospace;
      letter-spacing: .04em;
      color: #234769;
    }
    .success h1 {
      margin: 2% 0;
      font: 900 clamp(21px, 6.5vw, 48px) Impact, 'Arial Black', Arial, sans-serif;
      line-height: 1.06;
      color: #1c1d55;
      text-shadow: 2px 3px #efb926;
    }
    .success p {
      margin: 1.5% 0;
      color: #221d30;
      font: 700 clamp(12px, 3.5vw, 24px) monospace;
      line-height: 1.4;
    }
    .success .date {
      background: #f7c522;
      padding: 2% 5%;
      margin: 4% 0;
      font: 900 clamp(16px, 4.5vw, 30px) Impact, 'Arial Black', sans-serif;
      color: #191a3f;
    }
    .again {
      background: #1c2558;
      border: 2px solid #1c2558;
      color: #fff5cf;
      padding: 3% 7%;
      margin-top: 4%;
      font: 700 clamp(10px, 2.5vw, 17px) monospace;
      cursor: pointer;
    }

      color: #221d30;

      display: block;
      width: 100%;
      min-width: 0;
      background: #fffdf0;

      border-radius: 2px;
      padding: 5% 4%;
      font: 700 clamp(16px, 3vw, 22px) monospace;
      text-align: center;
      outline-offset: 2px;
    }
    .rsvp .confirm {
      background: #f7c522;
      color: #17152d;
      border: 3px solid #17152d;
      box-shadow: 3px 3px 0 #dc4046;
      padding: 5% 10%;
      margin-top: 3%;
      font: 900 clamp(12px, 3.2vw, 23px) Impact, 'Arial Black', Arial, sans-serif;
      cursor: pointer;
    }
    .rsvp .confirm:disabled { opacity: .7; cursor: wait; }

      background: none;
      border: 0;
      color: #234769;
      font: 700 clamp(10px, 2.2vw, 17px) monospace;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 2%;
    }
    .rsvp .hint, .rsvp .error {
      margin: 0;
      font: 700 clamp(8px, 2vw, 14px) monospace;
      line-height: 1.2;
    }
    .rsvp .hint { color: #465163; }
    .rsvp .error { color: #a01b25; min-height: 1.2em; }
    @media (max-height: 480px) and (orientation: landscape) {
      .rsvp { gap: 1%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #yes, .success.show { transition: none; animation: none; }
    }

<body>
  <main class="poster" aria-label="Pozivnica Katran 90s Are Back, 21. studenoga 2026.">
    <!-- Gumbi su postavljeni preko gumba na slici televizora. -->
    <button id="yes" class="hit" type="button" aria-label="Dolazim!">DOLAZIM!</button>
    <button id="no" class="hit" type="button" aria-label="Ne"> </button>


    <!-- Otvara se tek kada gost pritisne DOLAZIM! -->
    <form class="rsvp" id="rsvp" action="https://formspree.io/f/xbgogbjw" method="POST" aria-hidden="true">
      <div class="tag">● KATRAN TV / PRIJAVA</div>
      <h2>UPIŠI SVOJE IME</h2>
      <label for="guest-name" class="sr-only">Tvoje ime</label>
      <input id="guest-name" type="text" name="ime" placeholder="Tvoje ime" autocomplete="name" maxlength="70" required>
      <input type="hidden" name="dogadaj" value="KATRAN - 90s ARE BACK - 21.11.2026.">
      <button class="confirm" id="confirm" type="submit">POTVRDI DOLAZAK</button>
      <p class="error" id="form-error" role="alert" aria-live="polite"></p>
      <p class="hint">Ime se šalje organizatoru.</p>
      <button class="cancel" id="cancel" type="button">⟵ NATRAG</button>
    </form>

    <section class="success" id="success" aria-live="polite" aria-hidden="true">
      <div class="tag">● KATRAN TV / UŽIVO</div>
      <h1>POTVRĐENO!</h1>
      <p>VIDIMO SE NA<br>90s ARE BACK!</p>
      <div class="date">21.11.2026.</div>
      <p>SPREMI SE ZA<br>LEGENDARNU VEČER!</p>
      <button class="again" id="again" type="button">⟲ VRATI NA POČETAK</button>
    </section>
  </main>
  <script>
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    const success = document.getElementById('success');
    const again = document.getElementById('again');
    const rsvp = document.getElementById('rsvp');
    const guestName = document.getElementById('guest-name');
    const confirmBtn = document.getElementById('confirm');
    const cancelBtn = document.getElementById('cancel');
    const formError = document.getElementById('form-error');
    let noCount = 0;
    let sending = false;

    no.addEventListener('click', function () {
      noCount += 1;
      const scale = Math.min(1 + noCount * 0.4, 3.8);
      yes.classList.add('growing');
      yes.style.transform = `scale(${scale})`;
    });

    yes.addEventListener('click', function () {
      yes.disabled = true;
      no.disabled = true;
      formError.textContent = '';
      rsvp.classList.add('show');
      rsvp.setAttribute('aria-hidden', 'false');
      guestName.focus({ preventScroll: true });
    });

    cancelBtn.addEventListener('click', function () {
      if (sending) return;
      rsvp.classList.remove('show');
      rsvp.setAttribute('aria-hidden', 'true');
      yes.disabled = false;
      no.disabled = false;
    });

    rsvp.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (sending) return;
      const name = guestName.value.trim();
      if (!name) {
        formError.textContent = 'Upiši svoje ime za potvrdu.';
        guestName.focus();
        return;
      }
      sending = true;
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'ŠALJEM...';
      formError.textContent = '';
      try {
        const data = new FormData(rsvp);
        data.set('ime', name);
        const response = await fetch(rsvp.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) {
          let message = 'Prijava nije spremljena. Pokušaj ponovno.';
          try {
            const json = await response.json();
            if (Array.isArray(json.errors) && json.errors.length) {
              message = json.errors.map(e => e.message).filter(Boolean).join(' ');
            }
          } catch (_) {}
          throw new Error(message);
        }
        rsvp.classList.remove('show');
        rsvp.setAttribute('aria-hidden', 'true');
        success.classList.add('show');
        success.setAttribute('aria-hidden', 'false');
      } catch (error) {
        formError.textContent = error.message || 'Nema veze s internetom. Pokušaj ponovno.';
      } finally {
        sending = false;
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'POTVRDI DOLAZAK';
      }
    });

    again.addEventListener('click', function () {
      noCount = 0;
      yes.style.transform = '';
      yes.classList.remove('growing');
      rsvp.reset();
      formError.textContent = '';
      rsvp.classList.remove('show');
      rsvp.setAttribute('aria-hidden', 'true');
      success.classList.remove('show');
      success.setAttribute('aria-hidden', 'true');
      yes.disabled = false;
      no.disabled = false;
    });
  </script>
</body>
</html>
